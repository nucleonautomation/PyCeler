name: Native regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: '2'
      OMP_DYNAMIC: 'FALSE'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install build and regression dependencies
        run: python -m pip install -r requirements.txt numpy
      - name: Build stable ABI library
        run: python -B Compile.py package --mode abi --python-version 3.11
      - name: Run native regression suite
        run: python -B Test/Run.py
      - name: Package verified library
        run: python -B Compile.py wheel --library Build/Lib
      - name: Build cross-interpreter ABI fixture
        run: python -B Compile.py compile --input Test/ABI_Loops.py --output Test_Run/ABI_Native --no-select --openmp --mode abi --python-version 3.11
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python == '3.11' && '3.14' || '3.11' }}
      - name: Install verification dependencies in other interpreter
        run: python -m pip install -r requirements.txt numpy
      - name: Verify unchanged native package and fixture on other interpreter
        run: python -B Test/Verify_ABI.py Test_Run/ABI_Native
      - name: Verify installed wheel on other interpreter
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys
          Wheel = next(pathlib.Path('Build/Wheels').glob('*.whl'))
          subprocess.run([sys.executable, '-B', 'Test/Verify_Wheel.py', str(Wheel)], check=True)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.python }}
          path: |
            Build/Wheels/*.whl
            Build/Lib/PyCeler.manifest.json
            Build/Logs
            Test_Run/Run_*/Results.txt
            Test_Run/ABI_*.json
            Test_Run/Installed_Wheel_*/Installed_Wheel.json
            Test_Run/Installed_Wheel_*/Step_*.log
